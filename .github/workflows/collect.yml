name: collect

on:
  schedule:
    - cron: "7,37 * * * *"   # twice an hour, away from the busy top of the hour
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["collector/**", ".github/workflows/collect.yml"]

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect market data
        id: collect
        continue-on-error: true
        run: python collector/collect.py
      - name: Commit new data
        if: always()
        run: |
          git config user.name "atlas-collector"
          git config user.email "atlas-collector@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -q -m "data $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q && exit 0; sleep 5; done
          exit 1
      - name: Fail if the primary price source keeps failing
        if: steps.collect.outcome == 'failure'
        run: |
          echo "Bitstamp failed 3 runs in a row; see data/status.json"
          exit 1
