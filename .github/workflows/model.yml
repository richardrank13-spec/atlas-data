name: model

# The research market model's hourly snapshot for liqzo.app (model/README.md): RESEARCH ONLY, not a signal.
# Starts after every collect run, when the hour that just closed is in data/okx, and by hand. A run that finds no new
# closed hour ends in seconds. It commits only model/latest.json and model/log/; the collector is not touched.
on:
  workflow_run:
    workflows: ["collect"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: model
  cancel-in-progress: false

jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # an hour takes under a minute; the first run after the cache is lost recomputes every coin's hours (about a quarter of an hour)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # the branch head when the run starts: the candles the collector has just committed
          sparse-checkout: |
            model
            data/okx/btc-usdt-swap_1h_*.csv
            data/okx/eth-usdt-swap_1h_*.csv
            data/okx/bnb-usdt-swap_1h_*.csv
            data/okx/sol-usdt-swap_1h_*.csv
            data/okx/link-usdt-swap_1h_*.csv
            data/okx/ltc-usdt-swap_1h_*.csv
          sparse-checkout-cone-mode: false
      - name: Is there a closed hour without a snapshot?
        id: due
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import datetime, glob, json
          def last(a):
              f = sorted(glob.glob(f"data/okx/{a}-usdt-swap_1h_*.csv"))[-1]
              return int(open(f).read().rstrip().rsplit("\n", 1)[-1].split(",")[0])
          o = max(last("btc"), last("eth")) + 3600          # candles are stored by their open; the model speaks at the close
          want = datetime.datetime.fromtimestamp(o, datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          try: have = json.load(open("model/latest.json")).get("as_of")
          except Exception: have = None
          print("due=" + ("no" if have == want else "yes"))
          print("day=" + datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d"))
          EOF
          cat "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.due.outputs.due == 'yes'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: model/requirements.txt
      - name: Raw forecasts of earlier hours, one file per coin (saved once a day; without them the run recomputes them all)
        if: steps.due.outputs.due == 'yes'
        uses: actions/cache@v4
        with:
          path: .model-cache
          key: model-raws-${{ steps.due.outputs.day }}
          restore-keys: model-raws-
      - name: The snapshot
        if: steps.due.outputs.due == 'yes'
        run: |
          pip install -q -r model/requirements.txt
          python -I model/model_live.py selftest
          python -I model/model_live.py snapshot --okx data/okx --history model/forward_v1/history/c4_binance_stretch_2025.csv.gz \
            --cache .model-cache/raw.csv.gz --out model/latest.json --log model/log
      - name: Commit the snapshot
        if: steps.due.outputs.due == 'yes'
        run: |
          git config user.name "atlas-model"
          git config user.email "atlas-model@users.noreply.github.com"
          git add model/latest.json model/log
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -q -m "model $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q && exit 0; sleep 5; done
          exit 1
      - name: Fail if a closed hour is waiting and the snapshot is more than three hours old
        if: always() && steps.due.outputs.due == 'yes'
        run: |
          python3 - <<'EOF'
          import datetime, json, sys, time
          try:
              s = json.load(open("model/latest.json"))
              age = time.time() - datetime.datetime.fromisoformat(s["as_of"].replace("Z", "+00:00")).timestamp()
          except Exception as e:
              print("no snapshot:", e); sys.exit(1)
          print(f"latest snapshot {s['as_of']}, {age / 3600:.1f} h old")
          sys.exit(1 if age > 3 * 3600 else 0)
          EOF
